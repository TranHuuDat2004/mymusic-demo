<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player (Interactive)</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/artist.css">
    <link rel="stylesheet" href="css/sections.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/music-player.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/popup.css">

    <link rel="icon" href="img/favicon.png" type="image/png">
</head>

<body>

    <!-- Disclaimer Popup -->
    <div class="popup-overlay" id="disclaimer-popup">
        <div class="popup-content">
            <button class="popup-close-btn" id="popup-close" aria-label="Đóng">×</button>
            <h2>Thông Báo</h2>
            <p>Dự án này chỉ nhằm mục đích demo và học hỏi. Tất cả các bản nhạc được sử dụng trong dự án này đều thuộc bản quyền của các nghệ sĩ và nhà sản xuất gốc. Chúng tôi không sở hữu bất kỳ bản nhạc nào.</p>
            <button class="popup-confirm-btn" id="popup-confirm">Tôi đã hiểu</button>
        </div>
    </div>

    <button class="menu-toggle-btn" aria-label="Toggle menu">☰</button>
    <audio id="audio-player"></audio> <!-- THE AUDIO ELEMENT -->

    <div class="music-player-container">
        <!-- 1. Sidebar (NO CHANGES HERE FROM PREVIOUS) -->
        <!-- Sidebar sẽ được chèn tự động bởi sidebar.js -->
        <nav id="sidebar-container" class="sidebar"></nav>

        <!-- 2. Main Content Area -->
        <main class="main-content" id="home-content">
            <h1>Chào Trần Hữu Đạt</h1>
            <!-- Các section nhạc sẽ được tạo bởi JavaScript ở đây -->
             <div id="footer-placeholder"></div>
        </main>

        <!-- 3. Player Bar -->
        <!-- Placeholder cho Player Bar, player.js sẽ tự động điền vào đây -->
        <footer id="player-bar-container"></footer>

        <!-- THÊM MỚI: Placeholder cho màn hình Now Playing -->
        <div id="now-playing-fullscreen-container"></div>

        <!-- Placeholder cho Notification -->
        <div id="notification-container"></div>

    </div>

    <!-- Scripts -->

    <script src="js/utils.js"></script> <!-- Nạp file utils -->
    <script src="js/player.js"></script>
    <script src="js/main.js"></script> <!-- Thay vì search.js -->
    <script src="js/popup.js" defer></script> <!-- Script cho popup -->
    <!-- <script src="artist_page.js"></script> Nếu dùng -->
    <script src="js/sidebar.js" defer></script> <!-- Nạp sidebar.js -->
    <!-- Trong các file HTML -->
<script src="js/appendMainFooter.js" defer></script>
</body>


</html>
